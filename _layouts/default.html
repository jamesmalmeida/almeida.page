<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/research' | relative_url }}"{% if page.url contains '/research' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/courses-disciplinas' | relative_url }}"{% if page.url contains '/courses-disciplinas' %} aria-current="page"{% endif %}>Courses</a>
      </nav>
    </div>
  </header>

  <main class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
      <a href="{{ site.scholar }}">Google Scholar</a> ·
      <a href="{{ site.github }}">GitHub</a>
    </div>
  </footer>
</body>
</html>
